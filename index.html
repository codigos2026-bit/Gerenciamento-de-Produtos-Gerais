<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gerenciamento</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sistema de Gerenciamento</h1>
    </header>

    <main>

        <section class="formulario">

            <h2>Gerenciar Produtos</h2>

            <input type="hidden" id="produtoId">

            <div class="campo">
                <label for="nome">Nome do Produto</label>
                <input type="text" id="nome" placeholder="Digite o nome">
            </div>

            <div class="campo">
                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" placeholder="Digite a categoria">
            </div>

            <div class="campo">
                <label for="preco">Preço</label>
                <input type="number" id="preco" placeholder="Digite o preço" step="0.01">
            </div>

            <div class="botoes">
                <button id="btnAdicionar" onclick="adicionarProduto()">
                    Adicionar
                </button>

                <button id="btnAtualizar" onclick="atualizarProduto()" class="atualizar">
                    Atualizar
                </button>

                <button onclick="limparFormulario()" class="limpar">
                    Limpar
                </button>
            </div>

        </section>

        <section class="busca">

            <h2>Buscar Produto</h2>

            <input
                type="text"
                id="campoBusca"
                placeholder="Digite o nome do produto..."
                onkeyup="buscarProduto()"
            >

        </section>

        <section class="lista">

            <h2>Produtos Cadastrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                    <!-- Produtos serão adicionados pelo JavaScript -->
                </tbody>

            </table>

            <p id="mensagemVazia">
                Nenhum produto cadastrado.
            </p>

        </section>

    </main>

    <footer>
        <p>@Sistema de Gerenciamento</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
